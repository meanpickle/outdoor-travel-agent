<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>野途 Wildpath · 旅行工作台</title><meta name="description" content="从出发前到归来后的户外旅行 Agent 交互演示"><link rel="stylesheet" href="style.css"></head>
<body><aside><a class="brand" href="./">⌁ <span>野途<small>WILDPATH</small></span></a><div class="side-label">你的旅行空间</div><nav id="nav"></nav><div class="side-bottom"><span class="avatar">林</span><div>旅行体验官<small>本机演示空间</small></div></div></aside><main><header><span>我的旅行 <b>/</b> <span id="crumb">行程规划</span></span><span class="demo">DEMO · 模拟数据</span></header><div class="page-heading"><div><div class="eyebrow">LESS PLANNING. MORE WANDERING.</div><h1 id="page-title">下一站，去自然里。</h1><p id="subtitle">把想法交给野途，把时间留给路上。</p></div><button class="outline" id="export">↓ 导出旅行档案</button></div><section class="quick"><div class="quick-label">✧ 一句话，开始一段旅行 <span>QUICK MODE</span></div><form id="plan-form"><input id="prompt" aria-label="旅行需求" value="周末从杭州出发，去莫干山两天，一个人带狗徒步，预算1500元" required maxlength="300"><button class="primary" type="submit">生成行程 ↗</button></form><div class="presets"><button data-prompt="周末从杭州出发，去莫干山两天，一个人带狗徒步，预算1500元">带狗去山里</button><button data-prompt="从深圳出发，去深圳附近两天，一个人入门徒步，预算1000元">独行轻徒步</button><button data-prompt="从昆明出发，去云南五天，一个人徒步，预算3000元">云南慢探索</button><span>规则引擎演示 · 无需 API Key</span></div></section><div id="content"></div><footer>WILDPATH / 走得远一点，准备得好一点。<span>本 demo 数据仅在当前浏览器保存；路线、价格、天气与服务均为演示。</span></footer></main><dialog id="question"><form method="dialog"><span class="eyebrow">ONE QUICK QUESTION</span><h2>你的徒步经验是？</h2><p>这会影响路线强度和装备建议。</p><div class="experience"><button value="入门">入门 · 轻松走走</button><button value="熟悉">熟悉 · 有徒步经验</button><button value="进阶">进阶 · 经常徒步</button></div><button class="text-button" value="cancel">暂不生成</button></form></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
